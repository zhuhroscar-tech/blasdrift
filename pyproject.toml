[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blasdrift"
version = "0.1.0"
description = "Detect floating-point drift between numpy's BLAS-backed operations (Accelerate/OpenBLAS/MKL) and an independent, BLAS-free exact reference"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zhuhroscar-tech" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/blasdrift"

[project.scripts]
blasdrift = "blasdrift.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "threadpoolctl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
